# The shared OpAMP client core, compiled: the native library alone, no Python code
# and no source. The client (pydantic-opamp-client, ..) loads it through its C interface. One
# wheel per platform serves every Python; CI builds them (scripts/native_dist.py), and uv builds
# one for this machine from the repository (build_backend.py: the fetched library).
[project]
name = "pydantic-opamp-core"
version = "0.1.0"
description = "The shared OpAMP client core for pydantic-opamp-client, compiled"
readme = "README.md"
# The library is the core, under its own license (LICENSE.txt, with THIRD_PARTY_NOTICES.txt: both
# copied here by scripts/fetch_core.py fetch, which check holds to the lock).
license = "MIT AND LicenseRef-Pydantic-OpAMP-Core-Binary"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.11"

[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[tool.uv]
# Rebuild the wheel when what it is made from changes, not only this file: the fetched core's lock.
cache-keys = [{ file = "pyproject.toml" }, { file = "build_backend.py" }, { file = "../../opamp-core.lock.json" }]
