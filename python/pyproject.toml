[project]
name = "logfire-fleet-client"
version = "0.1.0"
description = "An OpAMP client for Python (asyncio), on the shared OpAMP core (Rust, natively)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12",  # client middlewares
    "protobuf>=6.31.1,<8",  # the generated code is protobuf 6's (scripts/gen_core.py)
    # The shared core, compiled: a library per platform, loaded through its C interface
    # (logfire_fleet_client._native). Closed; this package is the shell around it.
    "logfire-fleet-core==0.1.0",
]

[project.urls]
Repository = "https://github.com/pydantic/opamp-clients"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "pytest>=9",
    "trustme>=1.2.1",
    # The WebAssembly modules, as the oracle the native core is held to and to run a hostile
    # core (tests/_wasm.py): tests only.
    "wasmtime>=30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logfire_fleet_client"]
# The WebAssembly modules are the tests' oracle (tests/_wasm.py), not shipped.
exclude = ["src/logfire_fleet_client/*.wasm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Built from the repository (core/build_backend.py) for this machine.
logfire-fleet-core = { path = "core" }

[tool.uv]
# A build of this directory is cached until one of these changes (uv's default is pyproject.toml
# alone): without the sources, a uv run --with of the directory keeps an older build.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
