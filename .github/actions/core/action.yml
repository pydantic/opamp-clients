# The core in place for a job of ci.yml: the release opamp-core.lock.json pins, fetched and checked
# against the lock (scripts/fetch_core.py fetch). When ci.yml is called with a core candidate
# (workflow_call, CORE_ARTIFACT), the candidate's files, an artifact of the calling run, are
# locked and put in place instead, as a release would be (lock --from, fetch --from): every job
# then tests the clients on the core before it is released.
name: The core
description: Fetch the locked core release, or take in the candidate ci.yml was called with.
inputs:
  all-platforms:
    description: Also every platform's native library (fetch --all-platforms)
    default: "false"
runs:
  using: composite
  steps:
    - name: The candidate's files
      if: env.CORE_ARTIFACT != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.CORE_ARTIFACT }}
        path: .opamp-core-candidate
    - name: In place, and verified against the lock
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ALL_PLATFORMS: ${{ inputs.all-platforms }}
      run: |
        py=$(command -v python3 || command -v python)
        args=()
        if [ "$ALL_PLATFORMS" = true ]; then args+=(--all-platforms); fi
        if [ -n "$CORE_ARTIFACT" ]; then
          version=$("$py" -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' \
            .opamp-core-candidate/opamp-core.json)
          echo "The core candidate $version, in place of the locked release"
          "$py" scripts/fetch_core.py lock "$version" --from .opamp-core-candidate
          args+=(--from .opamp-core-candidate)
        fi
        "$py" scripts/fetch_core.py fetch "${args[@]}"
