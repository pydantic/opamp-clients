name: Windows installer hang

# Temporary: eight runs of CI's Windows installer job at once, each with a heartbeat
# (go/opampsupervisor/packaging/windows/ci-heartbeat.ps1) that writes the machine's state to a check
# run of its own every 30 s, from outside the runner. About a third of CI's runs of that job stop
# answering in the install or upgrade test and end with no log; the heartbeat's last report shows
# what took the runner down. It runs only on pull requests in this repository (it needs to write
# check runs, which a caller of ci.yml doesn't grant). Remove it once the cause is fixed.
#
# Seen so far (five of nine runs hung): the runner and the heartbeat both stop reaching GitHub a few
# seconds after the Supervisor service starts the Collector, during the install or the upgrade test;
# with tee or without. Defender's real-time protection is off on these runners. The hangs became far
# more common when the packages started bundling upstream otelcol-contrib (#123), so half the runs
# here build the .msi with the Collector the 0.9.0 release shipped (built from this repository, before
# #123); the upgrade test starts from 0.9.0 either way.
on:
  pull_request:
    paths:
      - .github/workflows/windows-installer-hang.yml
      - go/opampsupervisor/packaging/**

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows installer, ${{ matrix.collector }}, run ${{ matrix.run }}
    if: github.repository == 'pydantic/opamp-clients'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
        collector: [contrib, released]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opamp-core
          key: opamp-core-${{ runner.os }}-${{ hashFiles('opamp-core.lock.json') }}
      - name: The core, fetched and verified against the lock
        uses: ./.github/actions/core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go/opampsupervisor/go.sum
      - name: The packaging tests (the enroll script), as CI runs them
        working-directory: go/opampsupervisor/packaging
        run: |
          go vet -tags=install .
          go test -run WinEnroll -v .
      - name: The .msi, built (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          go/opampsupervisor/packaging/windows/build.ps1 -Version 255.0.0
      - name: The .msi built again with 0.9.0's Collector
        if: matrix.collector == 'released'
        shell: pwsh
        run: |
          $released = "$env:RUNNER_TEMP\0.9.0.msi"
          curl.exe -fsSL --retry 3 -o $released https://github.com/pydantic/opamp-clients/releases/download/go/opampsupervisor/v0.9.0/pydantic-opamp-supervisor-0.9.0-windows-amd64.msi
          if ((Get-FileHash $released).Hash -ne '2A7181195790180E507FC8EDAB4833E79F6E6575FD42CE05343B025194F19AD8') { throw 'checksum' }
          $out = "$env:RUNNER_TEMP\0.9.0"
          Start-Process -Wait -FilePath msiexec.exe -ArgumentList "/a `"$released`" /qn TARGETDIR=`"$out`""
          $collector = Get-ChildItem -Recurse -Filter otelcol.exe $out | Select-Object -First 1
          "0.9.0's Collector: $($collector.FullName) $($collector.Length) bytes"
          $packaging = "$PWD\go\opampsupervisor\packaging"
          Copy-Item $collector.FullName "$packaging\dist\otelcol\otelcol.exe" -Force
          Copy-Item $collector.FullName "$packaging\dist\windows-amd64\otelcol.exe" -Force
          Push-Location "$packaging\windows"
          wix build -arch x64 -d "Version=255.0.0" -d "Bin=$packaging\dist\windows-amd64" pydantic-opamp-supervisor.wxs -o "$packaging\dist\pydantic-opamp-supervisor-255.0.0-windows-amd64.msi"
          Pop-Location
          Get-Item "$packaging\dist\*.msi", "$packaging\dist\windows-amd64\*.exe" | Format-Table Length, Name
      - name: The heartbeat, started apart from the runner
        shell: pwsh
        env:
          HEARTBEAT_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ matrix.collector }}, run ${{ matrix.run }}
        run: |
          $script = "$PWD\go\opampsupervisor\packaging\windows\ci-heartbeat.ps1"
          # Start-Process joins ArgumentList with spaces and no quoting, so every value is quoted here.
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "`"$script`"",
            '-Repo', $env:GITHUB_REPOSITORY, '-Sha', $env:SHA, '-Name', "`"Windows installer heartbeat, run $env:RUN`"",
            '-Log', "`"$env:RUNNER_TEMP\install-test.log`"", '-Stop', "`"$env:RUNNER_TEMP\heartbeat.stop`"")
          Start-Process -WindowStyle Hidden -FilePath powershell.exe -ArgumentList ($arguments -join ' ')
      - name: The .msi installed, enrolled with a server that issues a token, and restarted
        working-directory: go/opampsupervisor/packaging
        run: |
          echo "compiling at $(date -u +%T)" > "$RUNNER_TEMP/install-test.log"
          go test -c -tags=install -o "$RUNNER_TEMP/install.test.exe" .
          echo "running at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" "$RUNNER_TEMP/install.test.exe" -test.run Install -test.v -test.timeout 12m
      - name: The released .msi, enrolled, then upgraded in place to this one
        working-directory: go/opampsupervisor/packaging
        timeout-minutes: 18
        env:
          RELEASED: https://github.com/pydantic/opamp-clients/releases/download/go/opampsupervisor/v0.9.0/pydantic-opamp-supervisor-0.9.0-windows-amd64.msi
          RELEASED_SHA256: 2a7181195790180e507fc8edab4833e79f6e6575fd42ce05343b025194f19ad8
        run: |
          echo "downloading at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/released.msi" "$RELEASED"
          echo "$RELEASED_SHA256  $RUNNER_TEMP/released.msi" | sha256sum -c -
          echo "upgrading at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$RUNNER_TEMP/released.msi")" OPAMP_UPGRADE="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" \
            "$RUNNER_TEMP/install.test.exe" -test.run Upgrade -test.v -test.timeout 12m
      - name: The heartbeat, stopped
        if: always()
        run: touch "$RUNNER_TEMP/heartbeat.stop"
