name: Windows installer hang

# Temporary: four runs of CI's Windows installer job at once, each with a heartbeat
# (go/opampsupervisor/packaging/windows/ci-heartbeat.ps1) that writes the machine's state to a check
# run of its own every 30 s, from outside the runner. About a third of CI's runs of that job stop
# answering in the install or upgrade test and end with no log; the heartbeat's last report shows
# what took the runner down. It runs only on pull requests in this repository (it needs to write
# check runs, which a caller of ci.yml doesn't grant). Remove it once the cause is fixed.
on:
  pull_request:
    paths:
      - .github/workflows/windows-installer-hang.yml
      - go/opampsupervisor/packaging/**

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows installer, run ${{ matrix.run }}
    if: github.repository == 'pydantic/opamp-clients'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opamp-core
          key: opamp-core-${{ runner.os }}-${{ hashFiles('opamp-core.lock.json') }}
      - name: The core, fetched and verified against the lock
        uses: ./.github/actions/core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go/opampsupervisor/go.sum
      - name: The .msi, built (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          go/opampsupervisor/packaging/windows/build.ps1 -Version 255.0.0
      - name: The heartbeat, started apart from the runner
        shell: pwsh
        env:
          HEARTBEAT_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ matrix.run }}
        run: |
          $script = "$PWD\go\opampsupervisor\packaging\windows\ci-heartbeat.ps1"
          # Start-Process joins ArgumentList with spaces and no quoting, so every value is quoted here.
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "`"$script`"",
            '-Repo', $env:GITHUB_REPOSITORY, '-Sha', $env:SHA, '-Name', "`"Windows installer heartbeat, run $env:RUN`"",
            '-Log', "`"$env:RUNNER_TEMP\install-test.log`"", '-Stop', "`"$env:RUNNER_TEMP\heartbeat.stop`"")
          Start-Process -WindowStyle Hidden -FilePath powershell.exe -ArgumentList ($arguments -join ' ')
      - name: The .msi installed, enrolled with a server that issues a token, and restarted
        working-directory: go/opampsupervisor/packaging
        run: |
          echo "compiling at $(date -u +%T)" > "$RUNNER_TEMP/install-test.log"
          go test -c -tags=install -o "$RUNNER_TEMP/install.test.exe" . 2>&1 | tee -a "$RUNNER_TEMP/install-test.log"
          echo "running at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" "$RUNNER_TEMP/install.test.exe" -test.run Install -test.v -test.timeout 12m 2>&1 | tee -a "$RUNNER_TEMP/install-test.log"
      - name: The released .msi, enrolled, then upgraded in place to this one
        working-directory: go/opampsupervisor/packaging
        env:
          RELEASED: https://github.com/pydantic/opamp-clients/releases/download/go/opampsupervisor/v0.9.0/pydantic-opamp-supervisor-0.9.0-windows-amd64.msi
          RELEASED_SHA256: 2a7181195790180e507fc8edab4833e79f6e6575fd42ce05343b025194f19ad8
        run: |
          echo "downloading at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/released.msi" "$RELEASED"
          echo "$RELEASED_SHA256  $RUNNER_TEMP/released.msi" | sha256sum -c -
          echo "upgrading at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$RUNNER_TEMP/released.msi")" OPAMP_UPGRADE="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" \
            "$RUNNER_TEMP/install.test.exe" -test.run Upgrade -test.v -test.timeout 12m 2>&1 | tee -a "$RUNNER_TEMP/install-test.log"
      - name: The heartbeat, stopped
        if: always()
        run: touch "$RUNNER_TEMP/heartbeat.stop"
