#
# Publishes a Supervisor release as a GitHub Release on its tag: for Linux, macOS and Windows on
# amd64 and arm64, an archive of the Supervisor and the bundled collector (packaging/archive.sh),
# with deb, rpm, .pkg and .msi installers, checksums, build provenance attestations, and a Cosign
# signature for each archive (what a Supervisor that accepts packages checks).
# Runs on a go/opampsupervisor/vX.Y.Z
# tag, or by hand for a tag already pushed (GitHub sends no push event when more than three tags
# are pushed at once).
name: Release

on:
  push:
    tags: ["go/opampsupervisor/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, e.g. 0.1.0 (its go/opampsupervisor/vX.Y.Z tag must exist)
        required: true
      installers-only:
        description: Add installers to an existing release without rebuilding its archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('go/opampsupervisor/v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION_IN: ${{ inputs.version || github.ref_name }}

jobs:
  version:
    name: The version, from the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          version=${VERSION_IN#go/opampsupervisor/v}
          # Releases alone, for now: no pre-releases.
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version isn't a version like 0.1.0"; exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # The Supervisor builds the Go client, which embeds the core: a release waits for the core's own
      # release when main pins a prerelease (X.Y.Z-dev.N).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: go/opampsupervisor/v${{ steps.v.outputs.version }}
          sparse-checkout: opamp-core.lock.json
          sparse-checkout-cone-mode: false
      - name: The core the lock pins is a release, not a prerelease
        run: |
          core=$(python3 -c 'import json; print(json.load(open("opamp-core.lock.json"))["version"])')
          if [[ $core == *-* ]]; then
            echo "::error::opamp-core.lock.json pins the core prerelease $core: lock the core's release before a Supervisor release"; exit 1
          fi

  build:
    name: The archive (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    if: ${{ !inputs.installers-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Built from the tag, also when run by hand.
          ref: go/opampsupervisor/v${{ needs.version.outputs.version }}
      # archive.sh from this workflow's commit, so a tag cut before it existed (v0.1.0) still builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release
          sparse-checkout: go/opampsupervisor/packaging/archive.sh
          sparse-checkout-cone-mode: false
      - name: The archive script, from this workflow's commit
        run: cp .release/go/opampsupervisor/packaging/archive.sh go/opampsupervisor/packaging/archive.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go/opampsupervisor/go.sum
      - name: Built
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go/opampsupervisor/packaging/archive.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            go/opampsupervisor/packaging/dist/*.tar.gz
            go/opampsupervisor/packaging/dist/*.zip
          if-no-files-found: error

  installers:
    name: The installers (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, runner: macos-latest}
          - {goos: windows, goarch: amd64, runner: windows-latest}
          - {goos: windows, goarch: arm64, runner: windows-11-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: go/opampsupervisor/v${{ needs.version.outputs.version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go/opampsupervisor/go.sum
      - name: The deb and rpm, built
        if: matrix.goos == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: go/opampsupervisor/packaging/build.sh
      - name: The .pkg, built
        if: matrix.goos == 'darwin'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: go/opampsupervisor/packaging/macos/build.sh
      - name: The .msi, built
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          go/opampsupervisor/packaging/windows/build.ps1 -Version $env:VERSION -Arch $env:ARCH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            go/opampsupervisor/packaging/dist/*.deb
            go/opampsupervisor/packaging/dist/*.rpm
            go/opampsupervisor/packaging/dist/*.pkg
            go/opampsupervisor/packaging/dist/*.msi
          if-no-files-found: error

  release:
    name: The GitHub Release
    needs: [version, build, installers]
    if: ${{ !cancelled() && needs.installers.result == 'success' && (needs.build.result == 'success' || (inputs.installers-only && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: The checksums
        env:
          INSTALLERS_ONLY: ${{ inputs.installers-only }}
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.pkg *.msi >SHA256SUMS.installers
          test "$(wc -l <SHA256SUMS.installers)" -eq 8
          if [ "$INSTALLERS_ONLY" != true ]; then
            sha256sum -- *.tar.gz *.zip >SHA256SUMS
            test "$(wc -l <SHA256SUMS)" -eq 6
          fi
          cat SHA256SUMS*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.installers-only }}
        with:
          cosign-release: v3.1.3
      - name: The archives, signed (Cosign, keyless)
        if: ${{ !inputs.installers-only }}
        working-directory: dist
        run: |
          # <archive>.sigstore.json is what an OpAMP server offers as the package's signature: the
          # Supervisor checks it (agent::package::verifier, config.PydanticCosignVerifier).
          for f in *.tar.gz *.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          test "$(ls *.sigstore.json | wc -l)" -eq 6
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*.msi
      - name: Published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALLERS_ONLY: ${{ inputs.installers-only }}
        run: |
          tag="go/opampsupervisor/v$VERSION"
          if [ "$INSTALLERS_ONLY" = true ]; then
            gh release view "$tag" >/dev/null
          fi
          notes="The Supervisor and a collector with this repository's opamp extension, for Linux, macOS and Windows on amd64 and arm64.
          Each archive holds \`opampsupervisor\` and \`otelcol\`; see [the collector docs](https://github.com/$GH_REPO/blob/$tag/docs/collector.md).
          Native installers are also included: deb and rpm for Linux, .pkg for macOS and .msi for Windows, on both architectures.
          The installers are unsigned. The macOS package is not notarized; install it with the command-line installer.
          Check an installer with \`sha256sum --check --ignore-missing SHA256SUMS.installers\`.
          Check an archive with \`sha256sum --check --ignore-missing SHA256SUMS\` or \`gh attestation verify <file> --repo $GH_REPO\`.
          Each archive's Cosign signature is \`<archive>.sigstore.json\`: an OpAMP server offers it with the archive to a Supervisor that accepts packages."
          # A rerun after a partial upload replaces the assets instead of failing on an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "Supervisor $VERSION" --notes "$notes"
          fi
