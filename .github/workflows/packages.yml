#
# Publishes a Supervisor release to the signed apt and yum repositories at packages.pydantic.dev:
# the deb and rpm for amd64 and arm64, added to what's published (packaging/publish.sh), then
# installed from the live URL as a user would. Runs on a go/opampsupervisor/vX.Y.Z tag, or by hand.
# Set up once (infra/packages makes all of it but the key): a `packages` environment with the secret
# PACKAGES_SIGNING_KEY (PACKAGES_SIGNING_KEY_PASSPHRASE if it has one), and the variables
# PACKAGES_BUCKET (gs://name), PACKAGES_URL, and PACKAGES_SERVICE_ACCOUNT and
# PACKAGES_WORKLOAD_IDENTITY_PROVIDER: the workflow publishes as that service account, with no key.
name: Packages

on:
  push:
    tags: ["go/opampsupervisor/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, e.g. 0.1.0
        required: true

permissions:
  contents: read

# Each publish reads the indexes and writes them back: two at once would lose one's packages.
concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    name: The deb and rpm, published to packages.pydantic.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: packages
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      REPO_URL: ${{ vars.PACKAGES_URL || 'https://packages.pydantic.dev' }}
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub's OIDC token becomes the publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: The version, from the tag
        run: |
          version=${VERSION#go/opampsupervisor/v}
          # Releases alone: a pre-release (0.2.0-rc.1) would land in stable.
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version isn't a version like 0.1.0"; exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: The signing key
        env:
          SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::the packages environment has no PACKAGES_SIGNING_KEY"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" >"$RUNNER_TEMP/signing.asc"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/signing.asc" >>"$GITHUB_ENV"
      - name: The packages, built for amd64 and arm64
        env:
          SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGES_SIGNING_KEY_PASSPHRASE }}
        run: |
          ARCH=amd64 go/opampsupervisor/packaging/build.sh
          ARCH=arm64 go/opampsupervisor/packaging/build.sh
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PACKAGES_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PACKAGES_SERVICE_ACCOUNT }}
      - name: The packages, added to the repositories
        env:
          SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGES_SIGNING_KEY_PASSPHRASE }}
          REPO_BUCKET: ${{ vars.PACKAGES_BUCKET }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          go/opampsupervisor/packaging/publish.sh
      - name: This release, installed from the live URL with the published key
        run: |
          docker run --rm -e REPO_URL -e VERSION debian:12 sh -euc '
            apt-get update -qq && apt-get install -y -qq ca-certificates curl >/dev/null
            install -d /etc/apt/keyrings
            curl -fsSL "$REPO_URL/pydantic-opamp.gpg" -o /etc/apt/keyrings/pydantic-opamp.gpg
            curl -fsSL "$REPO_URL/pydantic-opamp.sources" -o /etc/apt/sources.list.d/pydantic-opamp.sources
            apt-get update -qq
            # Installed, not just fetched: its dependencies resolve and its postinst runs.
            apt-get install -y -qq "pydantic-opamp-supervisor=$VERSION"'
