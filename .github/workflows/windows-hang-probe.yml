name: Windows installer hang probe

# Temporary, on this branch only: CI's Windows installer job eight times at once, each with
# go/opampsupervisor/packaging/windows/ci-probe.py running apart from the runner. It writes the
# machine's state to a check run of its own every 10 s over connections it keeps open, and checks
# DNS, new connections, the Azure host's wireserver and loopback on their own, every disk's
# throughput and latency, service state changes, and the newest msiexec log (the Logging policy is
# set for it). Round 2 had 4 of 6 runs go dark, idle controls 0 of 4. Remove before merging.
on:
  push:
    branches: [claude/project-thread-9rmm5t]
    paths:
      - .github/workflows/windows-hang-probe.yml
      - go/opampsupervisor/packaging/**
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows installer probe, ${{ matrix.kind }} ${{ matrix.run }}
    if: github.repository == 'pydantic/opamp-clients'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [test]
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The probe, started apart from the runner
        shell: pwsh
        env:
          HEARTBEAT_TOKEN: ${{ github.token }}
          RUN: ${{ matrix.kind }} ${{ matrix.run }}
        run: |
          python -m pip install --quiet psutil==7.2.2
          # Every msiexec writes a verbose log to TEMP, which the probe reports.
          New-Item -Force -Path HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer | Out-Null
          Set-ItemProperty -Path HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer -Name Logging -Value voicewarmupx
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Root, Used, Free
          Get-CimInstance Win32_DiskDrive | Format-Table Index, Model, Size
          $python = (Get-Command python).Source
          $script = "$PWD\go\opampsupervisor\packaging\windows\ci-probe.py"
          $temp = $env:RUNNER_TEMP
          Set-Content -NoNewline -Path "$temp\probe.token" -Value $env:HEARTBEAT_TOKEN
          # Created by WMI, not as a child of this step: the runner ends a step's processes with it.
          $command = "cmd.exe /c `"`"$python`" `"$script`" --repo $env:GITHUB_REPOSITORY --sha $env:GITHUB_SHA " +
            "--name `"Windows probe, $env:RUN`" --log `"$temp\install-test.log`" --stop `"$temp\probe.stop`" " +
            "--out `"$temp\probe.log`" --token-file `"$temp\probe.token`" 2> `"$temp\probe.err`"`""
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $command }
          "probe pid $($r.ProcessId), return $($r.ReturnValue)"
          "started at $((Get-Date).ToUniversalTime().ToString('HH:mm:ss'))" | Out-File "$temp\install-test.log"
          Start-Sleep -Seconds 15
          Get-Content "$temp\probe.err" -ErrorAction SilentlyContinue
          if (-not (Get-Process -Id $r.ProcessId -ErrorAction SilentlyContinue)) { throw 'the probe is not running' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .opamp-core
          key: opamp-core-${{ runner.os }}-${{ hashFiles('opamp-core.lock.json') }}
      - name: The core, fetched and verified against the lock
        uses: ./.github/actions/core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go/opampsupervisor/go.sum
      - name: The packaging tests (the enroll script)
        working-directory: go/opampsupervisor/packaging
        run: |
          go vet -tags=install .
          go test -run WinEnroll -v .
      - name: The .msi, built (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          go/opampsupervisor/packaging/windows/build.ps1 -Version 255.0.0
      - name: Idle instead of the tests (control)
        if: matrix.kind == 'idle'
        run: |
          echo "idling at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          sleep 600
      - name: The .msi installed, enrolled with a server that issues a token, and restarted
        if: matrix.kind == 'test'
        working-directory: go/opampsupervisor/packaging
        run: |
          echo "compiling at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          go test -c -tags=install -o "$RUNNER_TEMP/install.test.exe" .
          echo "running at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" "$RUNNER_TEMP/install.test.exe" -test.run Install -test.v -test.timeout 12m 2>&1 | tee -a "$RUNNER_TEMP/install-test.log"
      - name: The released .msi, enrolled, then upgraded in place to this one
        if: matrix.kind == 'test'
        timeout-minutes: 18
        working-directory: go/opampsupervisor/packaging
        env:
          RELEASED: https://github.com/pydantic/opamp-clients/releases/download/go/opampsupervisor/v0.9.0/pydantic-opamp-supervisor-0.9.0-windows-amd64.msi
          RELEASED_SHA256: 2a7181195790180e507fc8edab4833e79f6e6575fd42ce05343b025194f19ad8
        run: |
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/released.msi" "$RELEASED"
          echo "$RELEASED_SHA256  $RUNNER_TEMP/released.msi" | sha256sum -c -
          echo "upgrading at $(date -u +%T)" >> "$RUNNER_TEMP/install-test.log"
          OPAMP_MSI="$(cygpath -w "$RUNNER_TEMP/released.msi")" OPAMP_UPGRADE="$(cygpath -w "$PWD/dist/pydantic-opamp-supervisor-255.0.0-windows-amd64.msi")" \
            "$RUNNER_TEMP/install.test.exe" -test.run Upgrade -test.v -test.timeout 12m 2>&1 | tee -a "$RUNNER_TEMP/install-test.log"
      - name: The probe, stopped
        if: always()
        run: |
          touch "$RUNNER_TEMP/probe.stop"
          sleep 5
          cat "$RUNNER_TEMP/probe.err" || true
      - name: The probe's log, kept
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.kind }}-${{ matrix.run }}
          path: ${{ runner.temp }}/probe.log
