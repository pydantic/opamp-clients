
service:
  telemetry:
{{- if .TracesEndpoint}}
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .TracesEndpoint}}
                {{- if .TracesHeaders}}
                headers:
                {{- range $k := .TracesHeaders}}
                  {{yamlString $k.Key}}: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
{{- if .MetricsEndpoint}}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .MetricsEndpoint}}
                {{- if .MetricsHeaders}}
                headers:
                {{- range $k := .MetricsHeaders}}
                  {{yamlString $k.Key}}: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
{{- if .LogsEndpoint}}
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .LogsEndpoint}}
                {{- if .LogsHeaders}}
                headers:
                {{- range $k := .LogsHeaders}}
                  {{yamlString $k.Key}}: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
