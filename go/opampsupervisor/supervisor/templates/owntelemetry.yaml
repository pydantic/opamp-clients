{{/* Changed here: headers are a name/value list, the v0.3.0 declarative config format. A map is the
   deprecated v0.2.0 format, which the Collector migrates with a warning on every start. */}}
service:
  telemetry:
{{- if .TracesEndpoint}}
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .TracesEndpoint}}
                {{- if .TracesHeaders}}
                headers:
                {{- range $k := .TracesHeaders}}
                  - name: {{yamlString $k.Key}}
                    value: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
{{- if .MetricsEndpoint}}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .MetricsEndpoint}}
                {{- if .MetricsHeaders}}
                headers:
                {{- range $k := .MetricsHeaders}}
                  - name: {{yamlString $k.Key}}
                    value: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
{{- if .LogsEndpoint}}
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: {{yamlString .LogsEndpoint}}
                {{- if .LogsHeaders}}
                headers:
                {{- range $k := .LogsHeaders}}
                  - name: {{yamlString $k.Key}}
                    value: {{yamlString $k.Value}}
                {{- end}}
                {{- end}}
{{- end}}
