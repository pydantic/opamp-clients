receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        exclude_fs_types:
          fs_types:
            - overlay
            - tmpfs
            - devtmpfs
            - proc
            - sysfs
            - cgroup2fs
            - autofs
            - squashfs
            - nsfs
            - pipefs
            - fuse
          match_type: strict
      network: {}
      paging: {}
      load: {}
      processes: {}
  macos_unified_logging:
    format: ndjson
    max_log_age: 1m
    predicate: logType == 'error' OR logType == 'fault'
processors:
  resource_detection/host:
    detectors:
      - system
    override: false
    system:
      hostname_sources:
        - os
      resource_attributes:
        host.id:
          enabled: true
        host.arch:
          enabled: true
        os.description:
          enabled: true
  resource/service:
    attributes:
      - key: service.name
        value: macos-host
        action: insert
  batch: {}
exporters:
  otlp_http/logfire:
    endpoint: https://logfire-us.pydantic.dev
    headers:
      Authorization: Bearer ${env:LOGFIRE_TOKEN}
service:
  pipelines:
    metrics:
      receivers:
        - host_metrics
      processors: &a1
        - resource_detection/host
        - resource/service
        - batch
      exporters:
        - otlp_http/logfire
    logs:
      receivers:
        - macos_unified_logging
      processors: *a1
      exporters:
        - otlp_http/logfire
